<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ميزان" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeeef0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0f" />
    <meta name="description" content="ميزان: تتبع سعراتك وأكلك ووزنك" />
    <title>ميزان</title>
    <script>
      // Apply the saved theme before first paint so the page doesn't flash.
      try {
        var t = localStorage.getItem("theme")
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
